root: true
parserOptions:
  ecmaVersion: 2022
  sourceType: module
env:
  node: true
  es2022: true
ignorePatterns:
  - dist
  - node_modules
  - "**/*.d.ts"
overrides:
  - files: ["**/*.ts", "**/*.tsx"]
    parser: "@typescript-eslint/parser"
    parserOptions:
      project: false
    plugins:
      - "@typescript-eslint"
    extends:
      - eslint:recommended
      - plugin:@typescript-eslint/recommended
    rules:
      "@typescript-eslint/no-floating-promises": "off"
      "@typescript-eslint/no-unused-vars":
        - "warn"
        - { argsIgnorePattern: "^_", varsIgnorePattern: "^_" }
      "@typescript-eslint/no-explicit-any": "error"
      "no-console": "error"
  # CLI entrypoints (scripts, one-off backfills) print to stdout by design:
  # they have no request context and no log sink to ship structured logs to.
  - files:
      - "apps/api/src/scripts/**/*.ts"
    rules:
      "no-console": "off"
  # Test helpers deliberately fake loosely-typed Drizzle builders.
  - files:
      - "apps/api/tests/**/*.ts"
    rules:
      "@typescript-eslint/no-explicit-any": "off"
